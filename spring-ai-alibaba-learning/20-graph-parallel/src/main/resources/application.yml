# 本模块自己的配置文件。
# 关键点：通过 spring.config.import 导入“项目唯一的共享配置文件”，
# 这样 API Key、模型等只需在 config/spring-ai-alibaba-common.yml 配一次，本模块即可生效。
spring:
  main:
    web-application-type: none
  application:
    name: 20-graph-parallel
  config:
    import:
      - "optional:file:../config/spring-ai-alibaba-common.yml"
      - "optional:file:./config/spring-ai-alibaba-common.yml"
      - "optional:file:spring-ai-alibaba-learning/config/spring-ai-alibaba-common.yml"
